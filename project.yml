name: VitalSync
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_STRICT_CONCURRENCY: complete
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
targets:
  VitalSync:
    type: application
    platform: iOS
    configFiles:
      Debug: VitalSync/Configuration/Base.xcconfig
      Release: VitalSync/Configuration/Base.xcconfig
    sources:
      - VitalSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VitalSync
        INFOPLIST_FILE: VitalSync/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: VitalSync/Resources/VitalSync.entitlements
        PRODUCT_NAME: VitalSync
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - VitalSyncTests
  VitalSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VitalSyncTests
    dependencies:
      - target: VitalSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VitalSyncTests
        GENERATE_INFOPLIST_FILE: YES
